[package]
name = "pimbar"
version = "0.3.0"
edition = "2024"
description = "Azure PIM in your macOS menu bar"
license = "Apache-2.0"
repository = "https://github.com/blturan/pimbar"
authors = ["blturan"]

# For cargo-release: see Releasing in CONTRIBUTING.md.
[package.metadata.release]
publish = false
allow-branch = ["main"]
sign-commit = true
sign-tag = true
tag-message = "pimbar {{version}}"
pre-release-commit-message = "chore: release {{version}}"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSFont", "NSFontDescriptor", "NSResponder", "NSView", "NSStatusItem", "NSStatusBarButton", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "system-proxy", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tokio = { version = "1.54.0", features = ["time", "sync", "macros"] }
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
