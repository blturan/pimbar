name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

run-name: Releasing pimbar ${{ github.ref_name }} by @${{ github.actor }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag is signed
        run: |
          # actions/checkout drops the tag's signature
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git verify-tag "$GITHUB_REF_NAME" || {
            echo "::error::$GITHUB_REF_NAME isn't signed by a key in .github/allowed_signers"
            exit 1
          }

      - name: Tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"
            exit 1
          fi

      - name: Tag is newer than the last one
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          [ -z "$LATEST" ] && exit 0
          LOWER=$(printf '%s\n%s\n' "${GITHUB_REF_NAME#v}" "${LATEST#v}" | sort -V | head -n 1)
          if [ "$LOWER" = "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::$GITHUB_REF_NAME is not newer than $LATEST"
            exit 1
          fi

  release:
    name: Build and publish
    needs: validate
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # bundle_dmg lays out the installer window (background, icon places)
      # through Finder, which it skips when CI is set.
      - name: Build the .dmg
        uses: tauri-apps/tauri-action@v1
        env:
          CI: "false"
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          args: --bundles app,dmg --config tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: pimbar __VERSION__
          generateReleaseNotes: true

      - name: Point the Homebrew cask at it
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "target.noindex/release/bundle/dmg/pimbar_${VERSION}_aarch64.dmg" | cut -d ' ' -f 1)
          OWNER="${{ github.repository_owner }}"
          sed -i '' \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            -e "s#github\.com/[^/\"]*/pimbar#github.com/$OWNER/pimbar#g" \
            -e "s#brew tap [^/]*/pimbar#brew tap $OWNER/pimbar#" \
            Casks/pimbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pimbar.rb
          git commit -m "Cask: pimbar ${GITHUB_REF_NAME#v}" || exit 0
          git push origin HEAD
