# Releases pimbar when a v* tag is pushed: checks the version, builds the .dmg,
# publishes it as a GitHub release, and points the Homebrew cask in this repo
#
#   (bump version in Cargo.toml, commit, push)
#   git tag v0.2.0 && git push origin v0.2.0

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

run-name: Releasing ${{ github.ref_name }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"
            exit 1
          fi

      - name: Tag is newer than the last one
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          [ -z "$LATEST" ] && exit 0
          LOWER=$(printf '%s\n%s\n' "${GITHUB_REF_NAME#v}" "${LATEST#v}" | sort -V | head -n 1)
          if [ "$LOWER" = "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::$GITHUB_REF_NAME is not newer than $LATEST"
            exit 1
          fi

  release:
    name: Build and publish
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # bundle_dmg lays out the installer window (background, icon places)
      # through Finder, which it skips when CI is set.
      - name: Build the .dmg
        env:
          CI: "false"
        run: cargo tauri build --bundles dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "pimbar $VERSION" \
            --generate-notes \
            "target.noindex/release/bundle/dmg/pimbar_${VERSION}_aarch64.dmg"

      - name: Point the Homebrew cask at it
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "target.noindex/release/bundle/dmg/pimbar_${VERSION}_aarch64.dmg" | cut -d ' ' -f 1)
          OWNER="${{ github.repository_owner }}"
          sed -i '' \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            -e "s#github\.com/[^/\"]*/pimbar#github.com/$OWNER/pimbar#g" \
            -e "s#brew tap [^/]*/pimbar#brew tap $OWNER/pimbar#" \
            Casks/pimbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pimbar.rb
          git commit -m "Cask: pimbar ${GITHUB_REF_NAME#v}" || exit 0
          git push origin HEAD
